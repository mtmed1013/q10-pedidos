<p-toast />
<p-card class="max-w-sm w-full">
  <div class="page">
    <div class="header">
      <div>
        <img src="assets/images/q10-logo.png" class="logo-q10" />
      </div>
      <h2>Pedidos</h2>

      <button pButton label="Nuevo pedido" (click)="modal().open()">
        <i class="pi pi-plus"></i>Nuevo Pedido
      </button>
    </div>

    <div class="toolbar">
      <button type="button" pButton variant="outlined" size="small" (click)="clear(dt1)">
        Limpiar filtros
      </button>

      <div class="search">
        <p-iconfield iconPosition="left">
          <p-inputicon>
            <svg data-p-icon="search"></svg>
          </p-inputicon>

          <input
            pInputText
            type="text"
            [(ngModel)]="searchValue"
            (input)="dt1.filterGlobal($event.target.value, 'contains')"
            placeholder="Filtrar"
          />
        </p-iconfield>
      </div>
    </div>
    <p-table
      #dt1
      [value]="orders()"
      dataKey="id"
      sortField="creadoEn"
      [sortOrder]="-1"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [loading]="loading()"
      [paginator]="true"
      [globalFilterFields]="['clienteNombre', 'sku', 'cantidad', 'estado', 'creadoEn']"
    >
      <ng-template #header>
        <tr>
          <th style="min-width: 14rem">
            <div class="flex items-center justify-between gap-2">
              Nombre del Cliente
              <p-column-filter type="text" field="clienteNombre" display="menu" />
            </div>
          </th>
          <th style="min-width: 12rem">
            <div class="flex items-center justify-between gap-2">
              SKU
              <p-column-filter type="text" field="sku" display="menu" />
            </div>
          </th>
          <th style="min-width: 12rem">
            <div class="flex items-center justify-between gap-2">
              Cantidad
              <p-column-filter type="numeric" field="cantidad" display="menu" />
            </div>
          </th>
          <th style="min-width: 12rem">
            <div class="flex items-center justify-between gap-2">
              Estado
              <p-column-filter type="text" field="estado" matchMode="equals" display="menu">
              </p-column-filter>
            </div>
          </th>
          <th style="min-width: 12rem">
            <div class="flex items-center justify-between gap-2">
              Creado
              <p-column-filter field="creadoEn" matchMode="equals" display="menu">
              </p-column-filter>
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-order>
        <tr>
          <td>
            <span class="font-medium">{{ order.clienteNombre }}</span>
          </td>
          <td>
            <div class="flex items-center gap-2">
              <span>{{ order.sku }}</span>
            </div>
          </td>
          <td>
            <div class="flex items-center gap-2">
              <span class="text-sm">{{ order.cantidad }}</span>
            </div>
          </td>
          <td>
            <p-tag [value]="order.estado" [severity]="getSeverity(order.estado)" />
          </td>
          <td>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400 tabular-nums">{{
                order.creadoEn | date: 'dd/MM/yyyy HH:mm'
              }}</span>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="8">No customers found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-card>
<app-modal-create-order (saved)="loadOrders()" />
