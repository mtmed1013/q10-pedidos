services:
  sqlserver:
    # Para tu Mac ARM/M4.
    # En un servidor Linux x64 se debería usar:
    # image: mcr.microsoft.com/mssql/server:2022-latest
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: q10-sqlserver

    cap_add:
      - SYS_PTRACE

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "S4Port@2026"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      # Azure SQL Edge ARM no tiene garantizado sqlcmd dentro de la imagen.
      # Comprobamos que SQL ya esté escuchando en el puerto 1433.
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/1433' || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

    restart: unless-stopped

    networks:
      - q10-network


  rabbitmq:
    image: rabbitmq:3-management
    container_name: q10-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "check_running"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    restart: unless-stopped

    networks:
      - q10-network


  orders-api:
    build:
      context: ./backend/Orders.API
      dockerfile: Dockerfile

    container_name: q10-orders-api

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Q10Pedidos;User Id=sa;Password=S4Port@2026;TrustServerCertificate=True"

      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"

    ports:
      - "8080:8080"

    restart: unless-stopped

    networks:
      - q10-network


  inventory-worker:
    build:
      context: ./backend/Inventory.Worker
      dockerfile: Dockerfile

    container_name: q10-inventory-worker

    depends_on:
      orders-api:
        condition: service_started
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      DOTNET_ENVIRONMENT: "Production"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Q10Pedidos;User Id=sa;Password=S4Port@2026;TrustServerCertificate=True"

      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Port: "5672"

    restart: unless-stopped

    networks:
      - q10-network


  frontend:
    build:
      context: ./frontend/order-flow-ui
      dockerfile: Dockerfile

    container_name: q10-frontend

    depends_on:
      orders-api:
        condition: service_started

    ports:
      - "4200:80"

    restart: unless-stopped

    networks:
      - q10-network


volumes:
  sqlserver_data:
    name: q10-pedidos_sqlserver_data

  rabbitmq_data:
    name: q10-pedidos_rabbitmq_data


networks:
  q10-network:
    name: q10-pedidos-network
    driver: bridge